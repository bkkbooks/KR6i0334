body:
  text: 復次大慧菩薩摩訶薩至通達自心分別之相能取所取者亦云能緣所緣謂即心識見相二分也故華嚴經云能緣所緣力種種法出生餘文意謂欲了知者應離浮沈諸惡覺觀真實修行也復次大慧菩薩摩訶薩至當勤修學住智慧心所住相者即上云通達自心分別之相也何等為三所謂無影像相至於此三相修行不捨言跛驢者謂未得無功用慧故以況之大慧無影像相者至趣佛地故而得生起無影像相者謂無分別智離二取也然二乘外道所習淺陋如來常種種訶叱於此反取之者欲其回心捨邪途入正轍也諸佛願持相者謂如諸佛皆發弘誓成熟有情嚴淨佛土也自證聖智所趣相者謂如來法身自覺聖智相也餘文可知大慧是名上聖智三種相至應勤修學言以是三相能到如來地故勸令修學爾時大慧菩薩摩訶薩至聖智事自性法門諸菩薩衆心念謂五法三自性八識二無我皆是聖人度衆生法門事如來上既説八識竟亦應為我説百八句差別所依五法聖智事三自性法門衆有此念故大慧承諸佛神力而興是問言聖智事者即五法也一切如來應正等覺至色究竟天成如來身言自共相者且以四諦中苦諦言之如苦諦下三界依正蘊界處等一切諸法各各不同名自相苦諦即名共相謂苦諦四門中無常為一切有為法共相苦為一切有漏法共相空與無我通為一切法共相又如五陰不同名自相共成人身名共相界處等亦爾乃至一切諸法各各又有自共相也兜率陀者此云知足彼天內宮是一生補處菩薩所居也色究竟天是行滿報佛成正覺處餘文悉明遠離過習顯示衆德成就如來法身之義以有是利故請佛為説如上法門佛言大慧有一類外道至於此而生牛有角想自下如來約牛兔角破執名相起妄想見此明敘彼二外道計謂一外道見一切法隨因緣滅妄起分別想兔無角復一外道見大種功能根身塵境緣未散時形量差別計牛有角以不了故互執異見生決定解大慧彼墮二見不了唯心至一切皆唯分別所現此明牒破彼外道見文有八句上四句破起見因下四句示唯妄現故伽陀云知諸法唯心便捨外塵相由此息分別悟平等真空思之可了大慧應知兔角離於有無至是故於此不應分別此一段經上四句總結應離妄已下諸句別徵破也云何下別徵破彼墮無見也謂云何兔角離於有無破云互因待故彼兔角無因牛角有故若無牛角彼何所因而言無耶分析下次別破彼墮有見也謂若執於牛有角者分析牛角至於極微何有實體而計有耶故下偈云無因有故無是無不成無有待無亦然展轉相因起言皆不實也聖智所行離彼見者謂如實見者悉離有見常見之有亦離邪見斷見之無是故結勸應離分別爾時大慧菩薩摩訶薩至比度觀待妄計無耶大慧因上言兔角等離於有無互因待故分析牛角乃至極微求不可得而為離彼妄見復問佛言彼離見者既不作牛有角想豈不以比度觀待同妄計言無耶佛言不以分別至非由相待顯兔角無如來答言離妄見者不以分別起相觀待以言無也何以故彼妄見者以妄分別為生因故以角有無而起分別為其所依既所依為因即妄計有無然分別與角俱無定性離異不異離分別者非由相待牛角無性顯兔角無大慧若此分別異兔角者至執有執無二俱不成自下再牒破也言若此分別定異兔角者則非角因若定不異者又是因彼而起言俱無自性也分析牛角乃至極微求不可得異於有角而又言無角如是分別者定非理也謂若以有為有則以無為無有既不有則無無也故云二俱非有誰待於誰是知牛角兔角二俱無性而對何法言有言無耶若相待不成待於有故言兔角無者不應分別不正因故謂有與無為因無與有為因此因不正也既二因不正有無兩果理自不成故結破云有無論者執有執無二俱不成也大慧復有外道見色形狀至異虛空起於分別上以析法破牛兔此以體法會色空謂衆生所執聞宜不同故佛施能治巧拙有異亦是破轉計也言又有外道見色形狀質礙變異虛空分齊空廓無礙而生執著謂色異空起妄分別者此謂如來敘彼計也大慧虛空是色隨入色種至色空分齊應如是知自下正破也佛語大慧空即是色隨入色種中故色外無空也色即是空互為能所建立性故非色滅空也色空分齊應如是知大慧大種生時自相各別不住虛空中非彼無虛空會昔權説重明色空不二也謂昔破外道執有我故説有造色從大種生自相各別而密顯造色性即空故更無別色而住於空故云不住非彼無虛空也大慧兔角亦爾觀待牛角至若待餘物彼亦如是此又引上牛兔二角以合色空類觀諸法差別妄見一一對破應知亦爾然諸外道異計雖多不出惡見及無因邪因二種因也言惡見者謂於諸諦理顛倒推度染慧為性能障正見招苦為業謂惡見者多受苦故此見行相差別有五一薩迦耶見謂於五取蘊執我我所一切見趣所依為業二邊見謂即於彼隨執斷常障處中行出離為業三邪見謂謗因果作用實事及非四見諸餘邪説如增上緣名義遍故四見取謂於諸見及所依蘊執為最勝能得清淨一切鬪諍所依為業五戒禁取謂於隨順諸見戒禁及所依蘊執為最勝能得清淨無利勤苦所依為業二種因義如下當説大慧汝應遠離兔角牛角至説觀察自心修行之法佛勸菩薩應常觀察自心所見妄想之相既自知已於一切處轉相傳授普使知病識藥令得服行至安樂處爾時世尊即説頌言心所見無有唯依心故起至自證之境界上五行偈文顯可知更不繁釋此約外道執牛兔角決定有無及色空異以破五法中名相妄想竟爾時大慧菩薩摩訶薩至為漸次淨耶為頓淨耶此就淨衆生心習現流五法中次明正智義謂能淨者自覺聖智也所淨者自心現流也佛言大慧漸淨非頓至令離一切有無惡見上明四漸四頓者謂淨衆生自心現流其機大者頓之其機小者漸之漸者言其權頓者言其實權以趨實實以導權所以聖人開悟衆生或頓或漸權實偏圓未始不相顧者庶使含識隨宜得入也又云漸約修行未證入故謂衆生學行止得漸也頓約修行已證入故復次大慧法性所流佛至取以為實悉不可得此明三佛建立説法釋成頓漸所顯義也法性所流佛者報身佛也説一切自共相法是自心本識現習氣因相及前轉識妄計所執因相更相繫屬種種幻事皆無自性故起信云一切諸法皆是衆生無明妄心而得住持如鏡中像無體可得而衆生不了種種執著取以為實豈不誤哉復次大慧妄計自性執著緣起自性起言自共相等一切諸法本無自性依他衆緣和合生起猶如幻事即依他起性也而諸衆生妄想計度種種執著取以為實即是妄計自性執著緣起自性而起大慧譬如幻師以幻術力至種種分別皆無真實舉喻以明緣起不實如幻師依草木起衆生色像譬如來藏性隨緣起種種諸法故肇論云萬法假立不真譬如幻化人非無幻化人幻化人非真人也皆明緣起不實故大慧此亦如是至是名妄計性生此以法合謂於緣起性中生妄計性亦如是大慧是名法性所流佛説法相結説因緣所生諸法皆如幻不實大慧法性佛者建立自證智所行離心自性相建立自覺聖智所證法界離妄想心量自性塵境相是法佛法大慧化佛説施戒忍進禪定智慧至超無色行化佛八相示成應緣攝化説六度治六蔽離陰界入解脫諸識相隨宜建立諸法差別超外道執見越無色所行謂外道取無色以為涅槃復次大慧法性佛非所攀緣至當速捨離攀緣妄念也所緣妄法也所作妄業也餘義如文上既顯示三佛説法此結獨舉法佛所證法以勸修學者故法華經云雖説種種道其實為一乘復次大慧聲聞乘至分別執著自性相二約聲聞所證聖智以明正智義因上勸菩薩修自證聖智境界相然聲聞亦有自證聖智境界相欲簡異聲聞故舉聲聞有二種差別相初自證聖智異彼外道故云殊勝云何自證聖智殊勝相至自證聖智境界相言聲聞人於三界有情明見無常苦空無我及四諦境界厭離五欲栖心寂滅於蘊界處若自若共外不壞相而未獲法空但得人空慧如實了知故心住一境住一境已遂獲諸禪八解三三昧門八聖道分四沙門果而得出離也但斷現行煩惱未斷習煩惱但斷分段生死未離變易生死是故名為聲聞乘自證聖智境界相菩薩摩訶薩雖亦得此聖智境界至不應修學明菩薩所證是了一切法本性無生正受樂不同聲聞息陰界入求涅槃樂菩薩雖亦得是聖智境界以大悲本願故不取證寂滅及三昧樂故誡諸菩薩於此樂中不應修學大慧云何分別執著自性相至漸住諸地此謂聲聞知彼四大形顯色等種種諸法非如外道計作者生然守如來止啼權説於自共相妄想執著菩薩於彼應知唯是自心妄現故應捨離了我法空漸入智地到如來境爾時大慧菩薩摩訶薩至常不思議作者耶三破外道所計顯正智義因上如來説頓為顯示常不思議智大慧舉以白佛如來所説常不思議即是此間自證聖智第一義境將非同諸外道所説常不思議作者耶謂外道以作者為常不思議因相也佛言大慧非諸外道作者至常不思議不成如來告大慧非諸外道作者因緣得常不思議彼因自相不成故故楞嚴云以生滅心為本修因而求佛乘不生不滅無有是處大慧我第一義常不思議至是故菩薩當勤修學明如來舉上常不思議有因有相成也能所因相俱離有無謂自證聖智所行相故非餘境故有相第一義智為正因故非生滅故有因能所因相離有無故非作者譬如虛空涅槃寂滅無作法故常不思議是故我説異諸外道所有諍論此常不思議是諸如來自覺聖智所得故勸菩薩當勤修學復次大慧外道常不思議至非自相因力故常言外道以無常變異相為常不思議因故云常非是自覺所行相因力故常大慧外道常不思議至無常已不因此説為常明外道見世間所作法有已還無悉是無常妄計神我為常待無常已比知是常佛則反是不因此説以為常也大慧外道以如是因相至無自因相故若外道以如是無常因相成常不思議者此因相非真實故同於兔角故常不思議唯是妄想言説何以故無有常因常相故大慧我常不思議至此不應説前謂佛反外道此則外道反佛曾不能知常不思議自因之相離有無超情識而恆妄計在於自證聖智所行相外是故如來誡不應説然三乘之道優劣雖殊悉皆內證若心外見法任説幽玄然成外道復次大慧諸聲聞畏生死妄想苦至無所有故四約愚智觀解優劣以明正智不知生死涅槃差別之相是妄分別有者謂對生死説涅槃如對病説藥達生死無故所對涅槃亦不可得故思益經云諸佛出世不為令衆生出生死入涅槃但為度生死涅槃之二見耳妄想無性即涅槃故妄計未來諸根境滅至轉所依藏識為大涅槃以凡愚不知生死即涅槃計未來根境滅作涅槃想非是自覺所證境界如來證自智境界者以有識藏故妄見生死轉識藏故生死即涅槃故下經云妄想識滅名為涅槃彼愚癡人説有三乘至常於生死輪轉不絶愚夫以生死異涅槃為此愚夫説斷生死趣涅槃故説三乘種性智者説此六趣生死是妄想心量無有境界而彼愚夫不知三世如來所説生死妄想是自心現境界取心外境計生死相與涅槃差別故生死流轉復次大慧去來現在諸如來至非諸愚夫二分別境言三世如來説外心現一切諸法不生何以故謂自心所現非有性故不生離有無生二種見故不生此就智者知諸法無生起佛種性如兔馬等角本來不生凡愚不覺妄取生滅唯如來自覺所證之處一切法自體性相不生非愚夫有無分別境界大慧身及資生器世間等至汝於此義當勤修學言正報色身及資生器界一切諸法是本識影像能所二取之所變現妄想無性而諸愚夫墮彼見中分別有無故告大慧汝於此心現一切法不生義當勤修學復次大慧有五種種性至不定種性無種性五約種性以驗於機明正智義因上畏生死苦樂求涅槃起於種性故次明種性相也大慧云何知是聲聞乘種性至此是聲聞乘種性若聞滅陰界入自共相身得涅槃知苦斷集證滅修道時悲喜異相愛樂修習於緣起發悟之相不樂觀察應知以修上法名聲聞乘種性彼於自乘見所證已至乃至生於得涅槃覺此明聲聞斷惑分齊類諸菩薩第五六地然但斷三界現行煩惱未斷習使及所知障未度不思議變易死諸魔外中決定唱言我得四智究竟覺乃至生於得涅槃覺也大慧復有衆生求證涅槃至此是涅槃言有衆生妄計覺知我人衆生長養士夫各各差別以見神我此是涅槃復有執言自在天等以為作者名為涅槃此二即是無種性外道大慧彼無解脫至應勤修習捨此惡見此明外道計有神我性無解脫法聲聞取自共相未獲法空皆不出妄覺故應勤修習轉彼惡見而趣如來種性故大慧云何知是緣覺乘種性至應為其説緣覺乘法言若聞説緣起諸法知緣體空無所染著或時聞説現種種身或合多身為一身或離一身為多身及於神通變化信受無違欣樂修習是謂緣覺乘種性然有二種不同一遇佛演説十二因緣法依以受行名為緣覺即如一説二出無佛世覩緣自悟名為獨覺大慧如來乘種性至當知此是如來乘性自性無自性法者謂三自性三無性祕密法也內身自證聖智法者謂佛自證一乘了義不可思議真實法也外諸佛剎廣大法者謂廣大悲願莊嚴淨土攝化衆生究竟到於一切智地法也若有聞説此等法者是故名為佛乘種性大慧不定種性至隨生信解而順修學言此不定人聞説三乘法時隨生信入順學而成其性可移故言不定大慧為初治地人而説種性至作此建立初治地人即不定種性者三乘俱可入也為説是種性令彼明悟了權趣實超入第八無所有地任運至如來地故作此建立大慧彼住三昧樂聲聞至畢竟當得如來之身此明三乘五性同入如來一佛乘也謂昔權説三乘五性中定性二乘無性闡提不許成佛今究竟説雖有三乘五性之異由新熏故本來唯是一佛乘也舉一例諸是故但云彼住三昧樂聲聞既已修習斷煩惱結若能回心證知識性見法無我畢竟皆得無上最勝如來之身爾時世尊即説頌言預流一來果不還阿羅漢是等諸聖人其心悉迷惑言小乘初心修七方便至見諦理能斷三界見道所斷八十八使創預聖流名預流果次從是發六無礙道斷於欲界前之六品修所斷惑證第六解脫於人天更一往來名一來果又發後三無礙道永斷欲界七八九品諸煩惱盡更不還欲界受生名不還果又於色界修行永斷上二界修道所斷一切煩惱得盡智無生智不受後有名阿羅漢果如來方便為畏生死妄想苦愚夫説斷三界煩惱得諸果差別然皆不離心量故云是等諸聖人其心悉迷亂我所立三乘一乘及非乘為愚夫少智樂寂諸聖説佛應機立三一俱權三約一施一對三設三既不存一亦非有為彼愚夫樂寂諸聖故有是説第一義法門遠離於二取住於無境界何建立三乘於第一義中諸法無所有何有教法及有諸乘名諸禪及無量無色三摩提乃至滅受想唯心不可得諸禪及無量者謂四靜慮四無量心也無色三摩提即無色界四空處定也滅受想謂聲聞滅盡定也言如來説諸禪三昧等諸法亦無有實為妄想心量愚夫作如是説故云唯心不可得上明正智竟復次大慧此中一闡提至為無始衆生起願故三約菩薩闡提知生死涅槃無二以明如如義云何捨一切善根至善根悉斷不入涅槃言此闡提謗大乘法藏及作惡言此非隨順修多羅毗尼解脫之説以斷一切善根不得涅槃云何為無始衆生起願至此是無涅槃種性相菩薩本願方便欲斷一切衆生生死令得涅槃若一衆生未證入者我竟不入言一闡提以謗菩薩藏故不得涅槃菩薩知生死即涅槃亦更不得涅槃以不得涅槃名同故云亦住一闡提趣此是無涅槃種性相也大慧菩薩言世尊至是故菩薩一闡提不入涅槃言捨善根一闡提以如來神力故或時善根生得涅槃是故菩薩知生死即涅槃故言不入以上明如如竟復次大慧菩薩摩訶薩至緣起自性圓成自性上雖分別三自性為五法未知何者是三自性故下正明三自性體也言妄計自性者謂諸愚夫妄想計度所執蘊界入等為實我實法名妄計性此有二種一自性總執諸法實有自性二差別別執常無常等實有自體或依名妄計義或依義妄計名等約體不出人法二體約執不出名義二執又云衆生染心於依他起自性中有二種妄計自性一者隨覺即現行執二者慣習習氣隨眠即執種子也言緣起自性者謂依他衆緣和合生起猶如幻事名緣起自性亦有二義一依真理之他如波依水起二依妄緣之他如波依風圓成自性者謂妄想體空緣起無性即是圓成究竟唯一真心更無所有故楞嚴云無漏真淨云何是中更容他物上總釋竟下文即別釋大慧妄計自性從相生至種類顯現生計著故言妄想無體但從緣起事相生計執故大慧彼計著事相至是名二種妄計自性相言計此相起二種妄想是諸如來建立演説謂於內外法起男女瓶衣等名是名相計著相於彼內外法中計著自共相法是事相計著相即是自性差別二計著大慧從所依所緣起是緣起性依因也謂諸法從因緣而生名緣起性故云未曾有一法不從因緣生何者圓成自性至此是圓成自性如來藏心言圓成自性無別自體但於緣起自性離名相事相妄想分別自覺聖智所證如如此即圓成自性法身實體如來藏性清淨真心也是故須假如實方便離念觀察方能悟入故摩訶衍論云圓成實自性應知宣説四清淨法一自性清淨謂真如實際勝義法界二離垢清淨謂即此離一切障垢三得此道清淨謂一切波羅密多菩提分法四生此境清淨謂最上乘妙正法教如是四法總攝一切清淨諸法無有遺餘爾時世尊即説頌言名相分別二自性相正智如如是圓成實前明世出世間若因若果染淨差別不離五法此一行經還攝五法為三自性謂名相分別是妄計緣起二自性正智如如即圓成實是知三性無際隨一全收真妄互融性相無礙從緣起生分別即是妄計從緣起悟真實即是圓成所以由分別故一分成生死由真實故一分成涅槃了分別性空故即生死成涅槃迷真實性有故即涅槃成生死都是一法隨緣顯義成三三非三而一性圓一非一而三性具卷舒不失隱顯常如非一非三泯性相於實地而三而一耀行布於義天撮要所歸莫先斯旨大慧是名觀察五法自性法門至當勤修學結成五法三性法門以勸修學復次大慧菩薩摩訶薩至法無我相既能修學五法三自性已更當觀察人法二無我相言人無我者梵云補特伽羅此言數取趣謂諸有情起惑造業即為能取當來五趣名之為趣雖復數數起惑造業五趣輪回都無主宰實自在用故言無我經云無我無造無受者善惡之業亦不亡法無我者謂諸法體雖復任持軌生物解亦無勝性實自在用故言無我此二種執我或有有情總執補特伽羅為我或有有情別執色受想行識等為我故瑜伽云補特伽羅無我者謂離一切緣生行外別有實我不可得故法無我者謂即一切緣生諸行性非實我是無常故是故經云當善觀察上略通釋竟下文即別廣釋大慧何者是人無我相至皆是藏心之所顯現云何人無我謂離我云何離我謂於我所陰界入中分別觀察但是無明業愛等生於眼識等諸根妄取自心現妄想境界皆是藏心妄想施設彼無有我也此即就陰界入中以示無我剎那相續變壞不停至躁動不安如猿猴自下約喻舉五觀門以明無我此舉無常門也夫我謂常義今既無常故無有我文標六喻上五喻幻身下一喻妄心如水奔流種牙變易燈藉衆緣飄風不住浮雲起滅以上諸喻剎那變壞此身亦爾豈有常耶又妄心躁動等若猿猴既不能令身心常住我義焉在樂不淨處如飛蠅舉不淨門明其無我然一切世間貪著此身不淨之聚三十六物穢惡之軀如彼飛蠅玩於臭處我謂淨義故知無我不知厭足如猛火舉苦門以破我一云如風火我者樂義今貪欲無厭如風中猛火逢薪轉熾追求不得為苦所惱既無有樂故知無我無始虛偽習氣為因諸有趣中流轉不息如汲水輪舉不自在門以示無我謂無始虛偽習業所熏往來三有如汲井輪循環不息為愛水故溉灌業因即業因所推豈有實我種種色身威儀進止至亦如木人因機運動此舉空門以破我謂觀陰界入種種身色如機關木人呪術所起死尸雖若云為實非我也若能於此善知其相是名人無我智上以法喻推詰善知陰界入中悉無有我如機關木人等是名人空智大慧云何為法無我智謂知蘊界處是妄計性言菩薩知緣起陰界入法若執為實者是妄計自性本來非有故寶積經云了色不堅如聚沫思惟諸受等浮泡想如熱時陽焰動芭蕉諸行應觀察如世善幻舞戲者剎那便現諸色像了知識用亦如是智者於此皆無願此破凡夫執有五蘊也大般若云苦惱聚沫是蘊相如來覺為無相寶積又云內外十二處我説心為主彼復因業生業由思久住眼色俱為緣而生起於識緣闕則不生譬無薪之火如是生諸法和合互相生無作無受者現作用如幻一切內外法我已知空幻愚夫顛倒執分別我我所此破凡夫執有十二處十八界也大般若云生長門是處相如來覺為無相多毒害是界相如來覺為無相楞嚴亦云根塵同源縛解無二識性虛妄猶如空花如蘊界處離我我所至愚夫分別非諸聖者如陰界入空無我我所唯共積聚煩惱業故如繩自縛展轉相生無實自體一切諸法亦復如是離自共相由妄分別種種相現愚夫如是非諸聖者令知悟修超凡入聖如是觀察一切諸法至法無我智言諸聖賢何以不起妄想者以滅一切心意識名相妄想故得此智已知無境界至而坐其上自此已下明觀察法無我所得利益也謂見法無我故得入初地觀察開覺次第漸進乃至十地所作已辦有大寶花王衆寶莊嚴上有大寶宮殿蓮花王座菩薩修如幻三昧成就而坐其上受佛職位也同行佛子前後圍繞至而灌其頂言此菩薩欲受佛位故同類菩薩以為眷屬前後圍繞一切諸佛從十方來以手摩頂授以佛位如轉輪王授太子王位時以金鍾盛四大海水灌太子頂上授轉輪王位譬諸佛皆申右手摩菩薩頂授法王位超佛子地獲自證法至應勤修學以見法無我故乘茲增進行因圓滿故超菩薩地得如來法身是故諸菩薩當勤修學爾時大慧菩薩摩訶薩至願説建立誹謗相因上觀二無我能離有無斷常二見故請建立誹謗相也非有説有名建立非無説無名誹謗令我及諸菩薩摩訶薩至三藐三菩提若如來為我説者令我等離有無惡見疾得無上菩提得菩提已至令於正法不生毀謗言正法離有無若説於有無名謗正法佛受其請即説頌言身資財所住皆唯心影像至離心不可得言依正諸法不知自心妄現而起有無建立誹謗墮於二見也爾時世尊欲重明此義至無有性建立性是為四此列四名謂非有相見因性之中而橫立也大慧誹謗者至此是建立誹謗相彼於所建立法觀察不得而説言無名為誹謗矣大慧云何無有相建立相至是名無有相建立相言陰界入無自共相而妄計此如是自相也此不異共相也從無始過惡熏習所生故也云何無有見建立見至是名無有見建立見謂於蘊界處中妄建立我人衆生以為能見者云何無有因建立因至是名無有因建立因外道建立初識有因從冥諦而生佛言此識初不從冥諦因生其初識本無生後眼色明念等為因如幻生一念不住故生已有有還滅云何無有性建立性至是名無有性建立性言外道於三無為無作法而建立有性佛言此離性非性類明一切諸法離於有無猶如毛輪垂髮由翳目而生兔馬等角本自無有大慧建立誹謗至當勤觀察遠離此見總結離二惡見以勸修學大慧菩薩摩訶薩至五法自性二無我相已言佛説八識五法三性二無我者欲令衆生離於名相妄想得如來法身展轉相續成佛不斷為衆生故作種種身至不住聲聞辟支佛道為利衆生令得佛種不斷故隨衆生善根影現種種諸色身也如依緣起起於妄計以譬如來依衆生善根生也如摩尼珠不作心而隨色變以譬如來不作意能隨衆生善根心水大小而變亦如摩尼隨物而變以譬如來隨衆生善根現取佛土大衆集會於中説法其所説諸法不實如幻夢等菩薩既知諸法如幻而離生滅斷常等見亦離二乘自共相見聞已成就無量百千至悉令遠離有無等執言菩薩既知諸法如幻得諸地無量億三昧現成正覺復説自心現量法令衆離有無等見爾時世尊即説頌言佛子能觀見世間唯是心至一切皆成就言能觀察生死世間唯是自心妄現故如摩尼無思示於多身離所作行則一切成就也爾時大慧菩薩摩訶薩至無生無二無自性相因上説一切法如幻如夢即是説法空故大慧舉此空法以請如來又云自下舉空無生等為顯上四門至趣也所言空者明前五法非有無生以顯八識不生無二即二我兩亡離性即三性空寂故上經云見諸如來所行境界畢竟捨離五法自性我及諸菩薩悟此相故至三藐三菩提我等覺悟已即離妄想而證菩提佛言諦聽當為汝説至説空無生無二無自性言空者謂世間妄想計度性句義為愚夫計著諸法自性是以我説諸法空無生無二離自性相大慧略説空性有七種至彼彼空諸教辨空自有增減斯經雖略其義不殊云何相空謂一切法至是故名一切法自相空言諸法相展轉因緣積聚無自體故自他及共俱不生故相依何住云何自性空謂一切法自性不生是名自性空即生性體自性不生云何無行空所謂諸蘊本來涅槃至是名無行空一切諸決本性常滅不復更滅豈有行耶云何行空所謂諸蘊由業及因至是名行空言五陰諸行法從衆緣所起無有我我所故有為諸行空云何一切法不可説空至是名不可説空一切法從妄想所起無自性故離言説云何第一義聖智大空至是名第一義聖智大空謂如來得自覺聖智第一義時一切妄想見過習氣悉皆離故云何彼彼空謂於此無彼是名彼彼空此名互無空於此無彼於彼無此故名空於彼有此於此有彼即不名空譬如鹿子母堂無象馬牛羊等至非無比丘衆鹿子人名也其母即毗舍佉優婆夷深重三寶造立精舍安止比丘於中不畜象馬等象馬無故言空大慧非謂堂無堂自性至非謂餘處無象馬牛羊舍及比丘有不名空若餘處有象馬亦不説象馬空大慧一切諸法自共相至空中最麁汝應遠離言是空最麁非是真空故勸遠離復次大慧無生者至除住三昧是名無生此解無生言就因緣中破生故説不自生若破生説無生不是真無生除住八地如幻三昧以上是名真無生大慧無自性者以無生故至是名無自性言諸法一念不住異性起故名無自性云何無二相大慧如光影至皆相待立獨則不成言譬如光影長短黑白悉相待立無實故不得言二大慧非於生死外有涅槃至無自性相汝當勤學謂了妄想性空即生死成涅槃若迷真實性有即涅槃成生死如生死涅槃既無二類通一切法亦爾爾時世尊重説頌言我常説空法遠離於斷常生死如幻夢而彼業不壞言真實道理生死實空猶如幻夢但不得幻夢解者生死諸業即不可壞虛空及涅槃滅二亦如是愚夫妄分別諸聖離有無舉上三無為空不得對涅槃説生死亦不得對生死説涅槃愚夫妄想故説為二聖人體達故離有無爾時世尊復告大慧菩薩摩訶薩言至皆是此義言空等義普入諸經無有一法不含斯理大慧諸修多羅至令生水想而實無水此謂會權歸實也而諸經有不説空無生者以衆生悕望不一故如來隨衆生心作種種異説而實在乎心悟不在文言譬如群鹿為渴所逼見春時焰而作水想迷亂馳趣而彼陽焰實非是水衆經所説亦復如是至應隨順義莫著言説勸依實義莫著言説爾時大慧菩薩摩訶薩至如無價寶在垢衣中如來藏經亦云一切衆生貪瞋癡諸煩惱中有如來身常無染污德相具足如我無異外道説我是常作者至豈不同於外道我耶此難如來若説有如來藏義是違上一切修多羅皆應説空即同外道説有神我然彼計我其義有三一者體常名為作者二者雖在五陰而離於求那三者遍歷諸趣實非生滅今説藏義豈非同於外道我耶佛言大慧我説如來藏至不應於此執著於我言如來所説不同外道神我也外道説我如麻麥拇指立其定相佛説如來藏或名為空或名實際乃至無願斯則體一應物名異不同外道所説神我以愚夫恐怖於無我故如來方便説無所有境界作如來藏門勸諸菩薩不應於此同於外道計我大慧譬如陶師於泥聚中至種種名字各各差別如陶師依一泥聚隨其所須方便作種種器以譬如來於一法無我應機方便或説如來藏或説無我種種名字不同也大慧我説如來藏至應知無我如來藏義此明欲離妄見證無上菩提應知無我如來藏義然言如來藏者通有三義一隱覆義謂覆藏如來故云藏也故理趣般若經云一切衆生皆如來藏勝鬘經云如來法身不離煩惱藏名如來藏二含攝義謂如來法身含攝一切身相國土神通大用無量功德故亦謂含攝一切衆生皆在如來藏內故三出生義謂此法身既含衆德了達證入即能出生故十地論云地智能生無漏因果亦能生成人天道行此三義者初約迷時後約悟時中間剋體故勝鬘經云若於無量煩惱所纏如來藏不疑惑者於出纏無量煩惱藏法身亦無疑惑但果顯易信因隱難明故淺識之流輕因重果願諸學者深信自心爾時世尊而説頌言士夫相續蘊衆緣及微塵勝自在作者此但心分別外道所計由神我故令陰相續又計微塵等與生法為緣或計一切悉是勝妙自在天之所作此但心量妄想
